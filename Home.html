<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Digital Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* hide old parallax */
        .parallax { display: none !important; }

        /* default (fallback) hero background color while loader runs */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            background: linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.72)), #333;
            background-attachment: fixed;
            will-change: transform;
            background-size: cover;
            background-position: center;
        }

        .hero-section { position: relative; min-height: 100vh; z-index: 10; display:flex; align-items:center; justify-content:center; padding:2rem; }
        .card-text { cursor:pointer; user-select:none; }
        .hero-title { color:#fff; font-size:clamp(4rem,10vw,10rem); font-weight:800; text-align:center; text-shadow:0 6px 18px rgba(0,0,0,0.7); margin:0; }
        .hero-subtitle { 
            color:#fff; 
            display:inline-block; 
            margin-top:.6rem; 
            padding:.5rem 1rem; 
            border:3px solid rgba(255,255,255,0.12); 
            text-transform:uppercase; 
            letter-spacing:.15em; 
            font-weight:700;
            font-size:clamp(1.2rem,3vw,2rem);
        }

        /* Project container with background image */
        .project-options-container {
            position: relative;
            background-size: cover !important;
            background-position: center top !important;
            overflow: hidden;
            width: 260px !important;
            height: 260px !important;
            flex: 0 0 auto !important;
        }

        /* Overlay - clear by default, blurred on hover */
        .project-options-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition: background 0.4s ease, backdrop-filter 0.4s ease;
            z-index: 1;
            pointer-events: none;
        }

        /* Add blur on hover */
        .project-options-container:hover::before {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Ensure content is above the overlay */
        .project-options-container > * {
            position: relative;
            z-index: 2;
        }

        /* Make options-hover-text white */
        .options-hover-text {
            color: #ffffff !important;
        }

        /* Wrapper for title + container */
        .project-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 auto;
        }

        @media (max-width: 768px) {
            .project-options-container {
                width: 86% !important;
                height: auto !important;
                min-height: 220px;
            }
        }
    </style>
</head>
<body class="relative overflow-x-hidden">

    <!-- small loader script: tries multiple relative paths and sets hero background if image loads -->
    <script>
      (function(){
        const bg = document.querySelector('.hero-bg');
        const candidates = [
          'Container1/Assets/Apo.jpg',
          'Container1/Assets/apo.jpg',
          'Assets/Apo.jpg',
          'assets/Apo.jpg',
          './Container1/Assets/Apo.jpg',
          './Assets/Apo.jpg'
        ];

        function setBackground(url){
          bg.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.72)), url('" + url + "')";
          bg.style.backgroundSize = 'cover';
          bg.style.backgroundPosition = 'center';
        }

        function tryNext(i){
          if(i >= candidates.length){
            console.warn('Hero image not found. Tried:', candidates);
            return;
          }
          const src = candidates[i];
          const img = new Image();
          img.onload = function(){
            console.log('Loaded hero image:', src);
            setBackground(src);
          };
          img.onerror = function(){
            // try next path
            tryNext(i+1);
          };
          img.src = src;
        }

        tryNext(0);
      })();
    </script>
</body>
